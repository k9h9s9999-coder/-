<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>화면 가상 키보드</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

body {
background-color: #0d0e12;
color: #ffffff;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 16px;
}

.container {
width: 100%;
max-width: 600px;
display: flex;
flex-direction: column;
gap: 16px;
}

/* 상단 검색창 영역 */
.display-box {
background: #181a20;
border: 2px solid #00ff66;
border-radius: 12px;
padding: 12px 16px;
display: flex;
align-items: center;
gap: 10px;
box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
}

.display-box .icon {
font-size: 20px;
}

.search-input {
width: 100%;
background: transparent;
border: none;
outline: none;
color: #ffffff;
font-size: 22px;
font-weight: bold;
}

.search-input::placeholder {
color: #666;
}

/* 키보드 컨테이너 (무조건 노출) */
.keyboard {
background: #181a20;
border: 2px solid #00e5ff;
border-radius: 16px;
padding: 12px;
display: flex;
flex-direction: column;
gap: 8px;
box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
}

.kb-row {
display: flex;
justify-content: center;
gap: 6px;
width: 100%;
}

.key {
flex: 1;
height: 54px;
background: #262932;
color: #ffffff;
border: 1px solid #3a3f4d;
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
font-weight: bold;
cursor: pointer;
user-select: none;
transition: background 0.1s, transform 0.1s;
}

.key:active {
background: #00ff66 !important;
color: #000000 !important;
transform: scale(0.96);
}

.key.special {
background: #323745;
color: #00e5ff;
}

.key.delete {
background: #4a2428;
color: #ff4d4d;
}

.key.wide {
flex: 2;
}

.key.space {
flex: 4;
background: #2a303c;
}

.key.enter {
flex: 2;
background: #00ff66;
color: #000000;
font-weight: 800;
}

/* 결과 목록 영역 */
.results-box {
background: #181a20;
border: 1px solid #2a2e3d;
border-radius: 12px;
padding: 12px;
max-height: 200px;
overflow-y: auto;
}

.results-header {
font-size: 13px;
color: #00e5ff;
margin-bottom: 8px;
font-weight: bold;
}

.result-item {
padding: 10px 12px;
background: #21242e;
border-radius: 8px;
margin-bottom: 6px;
font-size: 15px;
color: #ddd;
cursor: pointer;
}

.result-item:hover {
background: #2c3140;
color: #00ff66;
}
</style>
</head>
<body>

<div class="container">
<!-- 입력창 -->
<div class="display-box">
<span class="icon">🔍</span>
<input type="text" id="text-display" class="search-input" placeholder="아래 가상 키보드로 입력하세요..." readonly>
</div>

<!-- 가상 키보드 본체 -->
<div class="keyboard" id="keyboard-body"></div>

<!-- 검색 결과 예시 -->
<div class="results-box">
<div class="results-header">💡 검색 결과</div>
<div id="results-list">
<div class="result-item">검색어를 입력해보세요.</div>
</div>
</div>
</div>

<script>
// 한글 자음/모음 조합 엔진
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ"];
const JONG = ["", "ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

// 복합 이중 자모 매핑
const DOUBLE_JUNG = {
'ㅗㅏ': 'ㅘ', 'ㅗㅐ': 'ㅙ', 'ㅗㅣ': 'ㅚ',
'ㅜㅓ': 'ㅝ', 'ㅜㅔ': 'ㅞ', 'ㅜㅣ': 'ㅟ', 'ㅡㅣ': 'ㅢ'
};

const DOUBLE_JONG = {
'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ', 'ㄹㄱ': 'ㄺ',
'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ', 'ㄹㅌ': 'ㄾ',
'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ'
};

let inputLetters = [];
let currentLang = 'KO';

const layouts = {
KO: [
['ㅂ', 'ㅈ', 'ㄷ', 'ㄱ', 'ㅅ', 'ㅛ', 'ㅕ', 'ㅑ', 'ㅐ', 'ㅔ'],
['ㅁ', 'ㄴ', 'ㅇ', 'ㄹ', 'ㅎ', 'ㅗ', 'ㅓ', 'ㅏ', 'ㅣ'],
['한/영', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅊ', 'ㅠ', 'ㅜ', 'ㅡ', '⌫'],
['CLEAR', 'SPACE', '검색 🔍']
],
EN: [
['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
['한/영', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫'],
['CLEAR', 'SPACE', 'SEARCH 🔍']
]
};

// 한글 타이핑 조합 알고리즘
function assembleHangul(letters) {
let result = '';
let state = 0; // 0: 빈상태, 1: 초성, 2: 중성, 3: 종성
let c = -1, j = -1, jo = -1;
let rawDoubleJung = '', rawDoubleJong = '';

for (let l of letters) {
if (CHO.includes(l) && !JUNG.includes(l)) { // 자음 입력
if (state === 0) {
c = CHO.indexOf(l);
state = 1;
} else if (state === 1) {
result += String.fromCharCode(0xAC00 + (c * 21 * 28));
c = CHO.indexOf(l);
} else if (state === 2) {
jo = JONG.indexOf(l);
if (jo !== -1) {
state = 3;
rawDoubleJong = l;
} else {
result += makeChar(c, j, 0);
c = CHO.indexOf(l);
j = -1;
state = 1;
}
} else if (state === 3) {
let combined = rawDoubleJong + l;
if (DOUBLE_JONG[combined]) {
jo = JONG.indexOf(DOUBLE_JONG[combined]);
rawDoubleJong = combined;
} else {
result += makeChar(c, j, jo);
c = CHO.indexOf(l);
j = -1; jo = -1;
state = 1;
}
}
} else if (JUNG.includes(l)) { // 모음 입력
if (state === 0) {
result += l;
} else if (state === 1) {
j = JUNG.indexOf(l);
rawDoubleJung = l;
state = 2;
} else if (state === 2) {
let combined = rawDoubleJung + l;
if (DOUBLE_JUNG[combined]) {
j = JUNG.indexOf(DOUBLE_JUNG[combined]);
rawDoubleJung = combined;
} else {
result += makeChar(c, j, 0);
c = -1; j = JUNG.indexOf(l);
rawDoubleJung = l;
state = 0;
result += l;
}
} else if (state === 3) {
// 종성을 다음 음절의 초성으로 분리
let prevJong = rawDoubleJong;
if (prevJong.length === 2) {
let firstJong = prevJong[0];
let secondJong = prevJong[1];
result += makeChar(c, j, JONG.indexOf(DOUBLE_JONG[prevJong] || firstJong));
c = CHO.indexOf(secondJong);
} else {
result += makeChar(c, j, 0);
c = CHO.indexOf(prevJong);
}
j = JUNG.indexOf(l);
jo = -1;
rawDoubleJung = l;
state = 2;
}
} else { // 기타 문구 (공백, 영문 등)
if (state !== 0) {
result += makeChar(c, j, jo < 0 ? 0 : jo);
c = -1; j = -1; jo = -1; state = 0;
}
result += l;
}
}

if (state === 1) result += CHO[c];
else if (state === 2) result += makeChar(c, j, 0);
else if (state === 3) result += makeChar(c, j, jo);

return result;
}

function makeChar(c, j, jo) {
if (c === -1 || j === -1) return '';
return String.fromCharCode(0xAC00 + (c * 21 * 28) + (j * 28) + jo);
}

// 키보드 생성
function renderKeyboard() {
const body = document.getElementById('keyboard-body');
body.innerHTML = '';
const layout = layouts[currentLang];

layout.forEach(row => {
const rowEl = document.createElement('div');
rowEl.className = 'kb-row';

row.forEach(key => {
const keyEl = document.createElement('div');
keyEl.className = 'key';
keyEl.innerText = key;

if (key === '한/영' || key === 'CLEAR') keyEl.classList.add('special', 'wide');
if (key === '⌫') keyEl.classList.add('delete', 'wide');
if (key === 'SPACE') keyEl.classList.add('space');
if (key === '검색 🔍' || key === 'SEARCH 🔍') keyEl.classList.add('enter');

keyEl.onclick = () => handleInput(key);
rowEl.appendChild(keyEl);
});

body.appendChild(rowEl);
});
}

// 입력 처리
function handleInput(key) {
if (key === '한/영') {
currentLang = currentLang === 'KO' ? 'EN' : 'KO';
renderKeyboard();
return;
}

if (key === 'CLEAR') {
inputLetters = [];
} else if (key === '⌫') {
inputLetters.pop();
} else if (key === 'SPACE') {
inputLetters.push(' ');
} else if (key === '검색 🔍' || key === 'SEARCH 🔍') {
updateResults();
return;
} else {
inputLetters.push(key);
}

const currentText = assembleHangul(inputLetters);
document.getElementById('text-display').value = currentText;
updateResults();
}

function updateResults() {
const query = document.getElementById('text-display').value;
const resultsContainer = document.getElementById('results-list');

if (!query.trim()) {
resultsContainer.innerHTML = '<div class="result-item">검색어를 입력해보세요.</div>';
return;
}

resultsContainer.innerHTML = &lt;div class="result-item"&gt;🔍 "${query}" 유투브 검색 결과 1</div>
<div class="result-item">🎬 "${query}" 관련 영상 추천&lt;/div&gt; &lt;div class="result-item"&gt;🎵 "${query}" 노래/음악 감상하기&lt;/div&gt;;
}

// 페이지 로드시 키보드 무조건 실행
renderKeyboard();
</script>
</body>
</html>
