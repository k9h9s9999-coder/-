<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ray-Ban YouTube HUD with Korean/English Keyboard</title>
<style>
:root {
--hud-green: #00FF66;
--hud-cyan: #00E5FF;
--hud-bg: #000000;
--hud-card: #111111;
--hud-highlight: #ff0055;
}

* { box-sizing: border-box; }

body {
margin: 0;
padding: 0;
background-color: var(--hud-bg);
color: var(--hud-green);
font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
overflow: hidden;
user-select: none;
}

/* HUD Viewport */
#hud-viewport {
width: 100%;
max-width: 500px;
height: 68vh;
margin-top: 10px;
border: 1px solid rgba(0, 255, 102, 0.2);
border-radius: 16px;
background: radial-gradient(circle, rgba(0, 255, 102, 0.03) 0%, rgba(0,0,0,1) 85%);
display: flex;
flex-direction: column;
padding: 12px;
position: relative;
}

/* Search Bar Input */
.search-box {
display: flex;
align-items: center;
background: #111;
border: 2px solid var(--hud-cyan);
border-radius: 10px;
padding: 8px 12px;
margin-bottom: 10px;
}

.search-input {
background: transparent;
border: none;
color: #FFF;
font-size: 18px;
font-weight: bold;
width: 100%;
outline: none;
}

.search-input::placeholder { color: #555; }

/* YouTube Results Grid */
#results-list {
display: flex;
flex-direction: column;
gap: 8px;
overflow-y: auto;
max-height: 180px;
margin-bottom: 10px;
}

.video-item {
display: flex;
gap: 10px;
background: #111;
border: 1px solid #333;
border-radius: 8px;
padding: 6px;
cursor: pointer;
}

.video-item.active {
border-color: var(--hud-green);
box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
background: #1a2e22;
}

.video-thumb {
width: 60px;
height: 40px;
background: #333;
border-radius: 4px;
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
}

.video-info {
display: flex;
flex-direction: column;
justify-content: center;
overflow: hidden;
}

.video-title {
font-size: 13px;
color: #FFF;
font-weight: 600;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.video-channel {
font-size: 11px;
color: #888;
}

/* Virtual Keyboard */
#virtual-keyboard {
display: flex;
flex-direction: column;
gap: 4px;
background: #080808;
padding: 8px;
border-radius: 10px;
border: 1px solid #222;
margin-top: auto;
}

.kb-row {
display: flex;
justify-content: center;
gap: 4px;
}

.kb-key {
background: #1c1c1c;
color: #FFF;
border: 1px solid #333;
border-radius: 6px;
padding: 8px 0;
flex: 1;
text-align: center;
font-size: 13px;
font-weight: bold;
}

.kb-key.focused {
background: var(--hud-green);
color: #000;
border-color: var(--hud-green);
box-shadow: 0 0 8px var(--hud-green);
}

.kb-key.wide { flex: 2; }
.kb-key.space { flex: 4; }

/* Video Player Overlay */
#player-overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: #000;
border-radius: 16px;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 10;
}

#player-frame {
width: 100%;
height: 75%;
border: none;
border-radius: 8px;
}

/* Controller Panel */
#controller-panel {
width: 100%;
max-width: 500px;
background: #111;
padding: 12px;
border-top-left-radius: 16px;
border-top-right-radius: 16px;
display: flex;
flex-direction: column;
gap: 8px;
}

.status-bar {
display: flex;
justify-content: space-between;
font-size: 12px;
color: var(--hud-cyan);
}

.dpad-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 6px;
}

button {
background: #222;
color: #FFF;
border: 1px solid #444;
padding: 10px;
border-radius: 8px;
font-size: 13px;
font-weight: bold;
cursor: pointer;
}

button:active { background: var(--hud-green); color: #000; }
</style>
</head>
<body>

<!-- HUD Viewport -->
<div id="hud-viewport">
<div class="search-box">
<span style="margin-right: 8px;">🔍</span>
<input type="text" id="search-input" class="search-input" placeholder="검색어를 입력하세요..." readonly>
<span id="lang-indicator" style="font-size:12px; color:var(--hud-cyan); font-weight:bold;">한글</span>
</div>

<!-- YouTube Search Results -->
<div id="results-list"></div>

<!-- Virtual Keyboard -->
<div id="virtual-keyboard"></div>

<!-- Video Player Overlay -->
<div id="player-overlay">
<iframe id="player-frame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div style="margin-top:10px; color:#FFF; font-weight:bold;" id="playing-title">비디오 재생 중...</div>
<button onclick="closePlayer()" style="margin-top:10px; background:#ff0055; border:none; padding:8px 16px;">❌ 영상 닫기 (손목 털기)</button>
</div>
</div>

<!-- Wristband Gesture Controller Panel -->
<div id="controller-panel">
<div class="status-bar">
<span id="ble-status">📡 BLE 손목밴드: 대기 중</span>
<span id="mode-status">입력 모드: 키보드 컨트롤</span>
</div>

<div class="dpad-grid">
<div></div>
<button onclick="moveCursor('UP')">▲ 위로</button>
<div></div>
<button onclick="moveCursor('LEFT')">◀ 왼쪽</button>
<button onclick="pressSelect()" style="background:var(--hud-green); color:#000;">🎯 선택</button>
<button onclick="moveCursor('RIGHT')">오른쪽 ▶</button>
<button onclick="toggleMode()">🔄 모드 전환</button>
<button onclick="moveCursor('DOWN')">▼ 아래로</button>
<button onclick="connectBLE()" style="background:#0055FF;">📡 BLE 연동</button>
</div>
</div>

<script>
// 키보드 레이아웃 정의 (한글 두벌식 / 영어 QWERTY)
const layouts = {
KO: [
['ㅂ', 'ㅈ', 'ㄷ', 'ㄱ', 'ㅅ', 'ㅛ', 'ㅕ', 'ㅑ', 'ㅐ', 'ㅔ'],
['ㅁ', 'ㄴ', 'ㅇ', 'ㄹ', 'ㅎ', 'ㅗ', 'ㅓ', 'ㅏ', 'ㅣ'],
['한/영', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅊ', 'ㅠ', 'ㅜ', 'ㅡ', '⌫'],
['공백', '검색 🔍']
],
EN: [
['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
['한/영', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫'],
['SPACE', 'SEARCH 🔍']
]
};

// 한글 조합 엔진용 초성/중성/종성 데이터
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG = ["ㅏ","ㅐ","ㅑ","ㅖ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const JONG = ["", "ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

const koMap = { 'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅍ':'c','ㅊ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m' };

// 예시 유튜브 비디오 데이터
const mockVideos = [
{ title: "Meta Ray-Ban Display 스마트 글래스 리뷰", channel: "테크Lab", id: "dQw4w9WgXcQ" },
{ title: "2026 차세대 wearable 디바이스 동향", channel: "미래IT", id: "3JZ_D3ELwOQ" },
{ title: "손목 제스처 컨트롤러 BLE 제작 튜토리얼", channel: "임베디드Maker", id: "L_LUpnjgPso" },
{ title: "K-POP 최신 인기곡 메들리 4K HUD View", channel: "MusicBox", id: "fJ9rUzIMcZQ" }
 ];

let currentLang = 'KO';
let cursorRow = 0;
let cursorCol = 0;
let rawText = "";
let controlMode = 'KEYBOARD'; // KEYBOARD or RESULTS
let selectedVideoIndex = 0;

// 가상 키보드 렌더링
function renderKeyboard() {
const kbContainer = document.getElementById('virtual-keyboard');
kbContainer.innerHTML = '';
const currentLayout = layouts[currentLang];

currentLayout.forEach((row, rIdx) => {
const rowDiv = document.createElement('div');
rowDiv.className = 'kb-row';

row.forEach((key, cIdx) => {
const keyDiv = document.createElement('div');
keyDiv.className = 'kb-key';
if (key === '공백' || key === 'SPACE' || key === '검색 🔍' || key === 'SEARCH 🔍') {
keyDiv.classList.add('wide');
}
if (controlMode === 'KEYBOARD' && rIdx === cursorRow && cIdx === cursorCol) {
keyDiv.classList.add('focused');
}
keyDiv.innerText = key;
rowDiv.appendChild(keyDiv);
});
kbContainer.appendChild(rowDiv);
});
}

// 유튜브 결과 렌더링
function renderResults() {
const resultsContainer = document.getElementById('results-list');
resultsContainer.innerHTML = '';

mockVideos.forEach((vid, idx) => {
const item = document.createElement('div');
item.className = 'video-item';
if (controlMode === 'RESULTS' && idx === selectedVideoIndex) {
item.classList.add('active');
}
item.innerHTML = &lt;div class="video-thumb"&gt;▶&lt;/div&gt; &lt;div class="video-info"&gt; &lt;div class="video-title"&gt;${vid.title}</div>
<div class="video-channel">${vid.channel}&lt;/div&gt; &lt;/div&gt;;
item.onclick = () => playVideo(vid);
resultsContainer.appendChild(item);
});
}

// 커서 이동 제어 (D-Pad / 손목밴드 신호)
function moveCursor(direction) {
if (controlMode === 'KEYBOARD') {
const layout = layouts[currentLang];
if (direction === 'UP' && cursorRow > 0) cursorRow--;
if (direction === 'DOWN' && cursorRow < layout.length - 1) cursorRow++;
if (direction === 'LEFT' && cursorCol > 0) cursorCol--;
if (direction === 'RIGHT' && cursorCol < layout[cursorRow].length - 1) cursorCol++;

// 행 변경 시 열 범위 초과 방지
if (cursorCol >= layout[cursorRow].length) {
cursorCol = layout[cursorRow].length - 1;
}
renderKeyboard();
} else {
if (direction === 'UP' && selectedVideoIndex > 0) selectedVideoIndex--;
if (direction === 'DOWN' && selectedVideoIndex < mockVideos.length - 1) selectedVideoIndex++;
renderResults();
}
}

// 선택 키 처리
function pressSelect() {
if (controlMode === 'KEYBOARD') {
const key = layouts[currentLang][cursorRow][cursorCol];

if (key === '한/영') {
currentLang = currentLang === 'KO' ? 'EN' : 'KO';
document.getElementById('lang-indicator').innerText = currentLang === 'KO' ? '한글' : 'English';
cursorRow = 0; cursorCol = 0;
renderKeyboard();
return;
}

if (key === '⌫') {
rawText = rawText.slice(0, -1);
} else if (key === '공백' || key === 'SPACE') {
rawText += " ";
} else if (key === '검색 🔍' || key === 'SEARCH 🔍') {
speakVoice(${document.getElementById('search-input').value} 검색 결과입니다.`);
controlMode = 'RESULTS';
document.getElementById('mode-status').innerText = "입력 모드: 검색 결과 목록";
renderResults();
renderKeyboard();
return;
} else {
rawText += key;
}

document.getElementById('search-input').value = rawText;
} else {
playVideo(mockVideos[selectedVideoIndex]);
}
}

// 모드 전환 (키보드 <-> 검색 결과 목록)
function toggleMode() {
controlMode = controlMode === 'KEYBOARD' ? 'RESULTS' : 'KEYBOARD';
document.getElementById('mode-status').innerText = 입력 모드:${controlMode === 'KEYBOARD' ? '키보드 컨트롤' : '검색 결과 목록'}`;
renderKeyboard();
renderResults();
}

// 영상 재생
function playVideo(video) {
document.getElementById('playing-title').innerText = video.title;
document.getElementById('player-frame').src = https://www.youtube.com/embed/${video.id}?autoplay=1; document.getElementById('player-overlay').style.display = 'flex'; speakVoice(``${video.title} 영상을 재생합니다.);
}

// 영상 닫기
function closePlayer() {
document.getElementById('player-frame').src = '';
document.getElementById('player-overlay').style.display = 'none';
}

// 음성 합성 (Web Speech)
function speakVoice(text) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = 'ko-KR';
window.speechSynthesis.speak(utterance);
}
}

// BLE 연동
async function connectBLE() {
if (!navigator.bluetooth) {
alert("이 브라우저는 Web Bluetooth API를 지원하지 않습니다.");
return;
}
try {
const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
document.getElementById('ble-status').innerText = 📡 BLE 연동됨: ${device.name || 'Wristband'};
} catch (e) {
document.getElementById('ble-status').innerText = "📡 BLE 연동 취소됨";
}
}

// 키보드 방향키 이벤트 매핑 (테스트용)
window.addEventListener('keydown', (e) => {
if (e.key === 'ArrowUp') moveCursor('UP');
if (e.key === 'ArrowDown') moveCursor('DOWN');
if (e.key === 'ArrowLeft') moveCursor('LEFT');
if (e.key === 'ArrowRight') moveCursor('RIGHT');
if (e.key === 'Enter') pressSelect();
if (e.key === 'Escape') closePlayer();
if (e.key === 'Tab') { e.preventDefault(); toggleMode(); }
});

// 초기화 실행
renderKeyboard();
renderResults();
</script>
</body>
</html>
