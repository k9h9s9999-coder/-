<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meta Ray-Ban Universal YouTube HUD</title>
<style>
:root {
--hud-green: #00FF66;
--hud-cyan: #00E5FF;
--hud-bg: #000000;
--hud-card: #111111;
--hud-red: #FF0055;
}

* { box-sizing: border-box; }

body {
margin: 0;
padding: 0;
background-color: var(--hud-bg);
color: var(--hud-green);
font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
overflow: hidden;
user-select: none;
}

/* Meta Ray-Ban Optical HUD Frame */
#hud-viewport {
width: 100%;
max-width: 500px;
height: 68vh;
margin-top: 10px;
border: 1px solid rgba(0, 255, 102, 0.3);
border-radius: 18px;
background: radial-gradient(circle, rgba(0, 255, 102, 0.05) 0%, rgba(0,0,0,1) 85%);
display: flex;
flex-direction: column;
padding: 12px;
position: relative;
}

/* Input Bar (Supports Native Keyboard Popup + Manual Focus) */
.search-bar-wrap {
display: flex;
align-items: center;
background: #111;
border: 2px solid var(--hud-cyan);
border-radius: 12px;
padding: 4px 10px;
margin-bottom: 8px;
box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
}

.search-bar-wrap.active {
border-color: var(--hud-green);
box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
}

/* Real HTML Input Field (Triggers Smartphone Native Virtual Keyboard) */
.real-search-input {
background: transparent;
border: none;
color: #FFFFFF;
font-size: 16px;
font-weight: bold;
width: 100%;
outline: none;
padding: 6px 0;
}

.real-search-input::placeholder { color: #666; }

.action-badge {
font-size: 12px;
background: rgba(0, 229, 255, 0.2);
color: var(--hud-cyan);
padding: 6px 8px;
border-radius: 6px;
font-weight: bold;
margin-left: 4px;
cursor: pointer;
white-space: nowrap;
}

/* Video Results List */
#results-list {
display: flex;
flex-direction: column;
gap: 6px;
overflow-y: auto;
max-height: 150px;
margin-bottom: 8px;
}

.video-card {
display: flex;
align-items: center;
gap: 10px;
background: #111;
border: 1px solid #333;
border-radius: 8px;
padding: 8px;
cursor: pointer;
}

.video-card.selected {
border-color: var(--hud-green);
background: #14281c;
box-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
}

.video-thumb {
width: 32px;
height: 32px;
background: #222;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 12px;
color: var(--hud-green);
flex-shrink: 0;
}

.video-title {
font-size: 13px;
color: #FFF;
font-weight: bold;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

/* AR Glass Virtual Keyboard */
#ar-keyboard {
display: flex;
flex-direction: column;
gap: 4px;
background: #080808;
padding: 8px;
border-radius: 12px;
border: 1px solid #222;
margin-top: auto;
}

.kb-row {
display: flex;
justify-content: center;
gap: 4px;
}

.kb-key {
background: #1c1c1c;
color: #FFF;
border: 1px solid #333;
border-radius: 6px;
padding: 10px 0;
flex: 1;
text-align: center;
font-size: 13px;
font-weight: bold;
cursor: pointer;
}

.kb-key:active {
background: var(--hud-green) !important;
color: #000 !important;
}

.kb-key.focused {
background: #2a3a30;
color: var(--hud-green);
border-color: var(--hud-green);
box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
}

.kb-key.wide { flex: 2; }

/* Video Player Overlay */
#player-overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: #000;
border-radius: 18px;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 20;
padding: 10px;
}

#player-frame {
width: 100%;
height: 80%;
border: none;
border-radius: 8px;
}

/* D-Pad & Controller Simulator */
#controller-panel {
width: 100%;
max-width: 500px;
background: #111;
padding: 10px;
border-top-left-radius: 16px;
border-top-right-radius: 16px;
display: flex;
flex-direction: column;
gap: 8px;
}

.status-bar {
display: flex;
justify-content: space-between;
font-size: 12px;
color: var(--hud-cyan);
padding: 0 4px;
}

.dpad-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 6px;
}

button {
background: #222;
color: #FFF;
border: 1px solid #444;
padding: 10px;
border-radius: 8px;
font-size: 13px;
font-weight: bold;
cursor: pointer;
}

button:active { background: var(--hud-green); color: #000; }
</style>
</head>
<body>

<!-- HUD Viewport -->
<div id="hud-viewport">
<div class="search-bar-wrap active" id="search-container">
<span style="margin-right: 6px;">🔍</span>
<!-- 실제 스마트폰 키보드가 팝업되는 Real Input -->
<input type="text" id="real-input" class="real-search-input" placeholder="터치시 스마트폰 키보드 팝업..." autocomplete="off">
<span class="action-badge" id="mic-btn" onclick="startVoiceSearch(event)">🎤 음성</span>
<span class="action-badge" id="lang-btn" onclick="toggleLanguage(event)">한글</span>
</div>

<!-- YouTube Search Results -->
<div id="results-list"></div>

<!-- AR Glass Virtual Keyboard -->
<div id="ar-keyboard"></div>

<!-- YouTube Video Player Modal -->
<div id="player-overlay">
<iframe id="player-frame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div style="margin-top:8px; color:#FFF; font-weight:bold; font-size:14px;" id="playing-title">영상 재생 중...</div>
<button onclick="closePlayer()" style="margin-top:8px; background:var(--hud-red); border:none; width:100%;">❌ 영상 닫기 (손목 털기 제스처)</button>
</div>
</div>

<!-- Wristband Gesture Controller Panel -->
<div id="controller-panel">
<div class="status-bar">
<span id="ble-status">📡 BLE 손목밴드: 연결 대기</span>
<span id="mode-status">제어 모드: 가상 키보드 입력</span>
</div>

<div class="dpad-grid">
<div></div>
<button onclick="moveCursor('UP')">▲ 위로</button>
<div></div>
<button onclick="moveCursor('LEFT')">◀ 왼쪽</button>
<button onclick="pressSelect()" style="background:var(--hud-green); color:#000;">🎯 선택</button>
<button onclick="moveCursor('RIGHT')">오른쪽 ▶</button>
<button onclick="toggleControlMode()">🔄 모드 전환</button>
<button onclick="moveCursor('DOWN')">▼ 아래로</button>
<button onclick="connectBLE()" style="background:#0055FF;">📡 BLE 연동</button>
</div>
</div>

<script>
// 가상 키보드 데이터
const layouts = {
KO: [
['ㅂ', 'ㅈ', 'ㄷ', 'ㄱ', 'ㅅ', 'ㅛ', 'ㅕ', 'ㅑ', 'ㅐ', 'ㅔ'],
['ㅁ', 'ㄴ', 'ㅇ', 'ㄹ', 'ㅎ', 'ㅗ', 'ㅓ', 'ㅏ', 'ㅣ'],
['한/영', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅊ', 'ㅠ', 'ㅜ', 'ㅡ', '⌫'],
['공백', '검색 🔍']
],
EN: [
['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
['한/영', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫'],
['SPACE', 'SEARCH 🔍']
]
};

const allVideos = [
{ title: "Meta Ray-Ban Display 스마트 글래스 리뷰", channel: "테크Lab", id: "dQw4w9WgXcQ" },
{ title: "2026 차세대 wearable 디바이스 동향", channel: "미래IT", id: "3JZ_D3ELwOQ" },
{ title: "손목 제스처 컨트롤러 BLE 제작 튜토리얼", channel: "임베디드Maker", id: "L_LUpnjgPso" },
{ title: "K-POP 최신 인기곡 메들리 4K HUD View", channel: "MusicBox", id: "fJ9rUzIMcZQ" }
 ];

let currentLang = 'KO';
let cursorRow = 0;
let cursorCol = 0;
let controlMode = 'KEYBOARD';
let selectedVideoIndex = 0;
let filteredVideos = [...allVideos];

const inputEl = document.getElementById('real-input');

// 스마트폰 기본 키보드 타이핑 연동
inputEl.addEventListener('input', (e) => {
filterResults(e.target.value);
});

inputEl.addEventListener('keydown', (e) => {
if (e.key === 'Enter') {
executeSearch();
inputEl.blur(); // 키보드 닫기
}
});

// 음성 인식 (Web Speech API)
function startVoiceSearch(e) {
e.stopPropagation();
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
alert("이 브라우저는 음성 인식을 지원하지 않습니다.");
return;
}
const recognition = new SpeechRecognition();
recognition.lang = 'ko-KR';
document.getElementById('mic-btn').innerText = '🎙️ 듣는 중...';

recognition.onresult = (evt) => {
const text = evt.results[0][0].transcript;
inputEl.value = text;
filterResults(text);
document.getElementById('mic-btn').innerText = '🎤 음성';
executeSearch();
};

recognition.onerror = () => {
document.getElementById('mic-btn').innerText = '🎤 음성';
};

recognition.start();
}

// 가상 키보드 UI
function renderKeyboard() {
const container = document.getElementById('ar-keyboard');
container.innerHTML = '';
const currentLayout = layouts[currentLang];

currentLayout.forEach((row, rIdx) => {
const rowDiv = document.createElement('div');
rowDiv.className = 'kb-row';

row.forEach((key, cIdx) => {
const keyDiv = document.createElement('div');
keyDiv.className = 'kb-key';
if (key === '공백' || key === 'SPACE' || key === '검색 🔍' || key === 'SEARCH 🔍') {
keyDiv.classList.add('wide');
}
if (controlMode === 'KEYBOARD' && rIdx === cursorRow && cIdx === cursorCol) {
keyDiv.classList.add('focused');
}
keyDiv.innerText = key;

keyDiv.onclick = (e) => {
e.stopPropagation();
cursorRow = rIdx; cursorCol = cIdx;
pressKey(key);
};

rowDiv.appendChild(keyDiv);
});
container.appendChild(rowDiv);
});
}

// 키 클릭 시 입력
function pressKey(key) {
if (key === '한/영') {
currentLang = currentLang === 'KO' ? 'EN' : 'KO';
document.getElementById('lang-btn').innerText = currentLang === 'KO' ? '한글' : 'English';
cursorRow = 0; cursorCol = 0;
} else if (key === '⌫') {
inputEl.value = inputEl.value.slice(0, -1);
filterResults(inputEl.value);
} else if (key === '공백' || key === 'SPACE') {
inputEl.value += ' ';
filterResults(inputEl.value);
} else if (key === '검색 🔍' || key === 'SEARCH 🔍') {
executeSearch();
return;
} else {
inputEl.value += key;
filterResults(inputEl.value);
}
renderKeyboard();
}

function executeSearch() {
controlMode = 'RESULTS';
document.getElementById('mode-status').innerText = '제어 모드: 검색 결과 선택';
document.getElementById('search-container').classList.remove('active');
renderResults();
renderKeyboard();
}

function filterResults(query) {
if (!query.trim()) {
filteredVideos = [...allVideos];
} else {
filteredVideos = allVideos.filter(v => v.title.includes(query) || v.channel.includes(query));
}
if (filteredVideos.length === 0) filteredVideos = [...allVideos];
renderResults();
}

function renderResults() {
const container = document.getElementById('results-list');
container.innerHTML = '';

filteredVideos.forEach((vid, idx) => {
const card = document.createElement('div');
card.className = 'video-card';
if (controlMode === 'RESULTS' && idx === selectedVideoIndex) {
card.classList.add('selected');
}
card.innerHTML = &lt;div class="video-thumb"&gt;▶&lt;/div&gt; &lt;div&gt; &lt;div class="video-title"&gt;${vid.title}</div>
<div style="font-size:11px; color:#888;">${vid.channel}&lt;/div&gt; &lt;/div&gt;;
card.onclick = () => playVideo(vid);
container.appendChild(card);
});
}

function moveCursor(dir) {
if (controlMode === 'KEYBOARD') {
const layout = layouts[currentLang];
if (dir === 'UP' && cursorRow > 0) cursorRow--;
if (dir === 'DOWN' && cursorRow < layout.length - 1) cursorRow++;
if (dir === 'LEFT' && cursorCol > 0) cursorCol--;
if (dir === 'RIGHT' && cursorCol < layout[cursorRow].length - 1) cursorCol++;
if (cursorCol >= layout[cursorRow].length) cursorCol = layout[cursorRow].length - 1;
renderKeyboard();
} else {
if (dir === 'UP' && selectedVideoIndex > 0) selectedVideoIndex--;
if (dir === 'DOWN' && selectedVideoIndex < filteredVideos.length - 1) selectedVideoIndex++;
renderResults();
}
}

function pressSelect() {
if (controlMode === 'KEYBOARD') {
const key = layouts[currentLang][cursorRow][cursorCol];
pressKey(key);
} else {
playVideo(filteredVideos[selectedVideoIndex]);
}
}

function toggleControlMode() {
controlMode = controlMode === 'KEYBOARD' ? 'RESULTS' : 'KEYBOARD';
document.getElementById('mode-status').innerText = 제어 모드: ${controlMode === 'KEYBOARD' ? '가상 키보드 입력' : '검색 결과 선택'}`;
document.getElementById('search-container').classList.toggle('active', controlMode === 'KEYBOARD');
renderKeyboard();
renderResults();
}

function toggleLanguage(e) {
e.stopPropagation();
currentLang = currentLang === 'KO' ? 'EN' : 'KO';
document.getElementById('lang-btn').innerText = currentLang === 'KO' ? '한글' : 'English';
renderKeyboard();
}

function playVideo(video) {
document.getElementById('playing-title').innerText = video.title;
document.getElementById('player-frame').src = https://www.youtube.com/embed/${video.id}?autoplay=1`;
document.getElementById('player-overlay').style.display = 'flex';
}

function closePlayer() {
document.getElementById('player-frame').src = '';
document.getElementById('player-overlay').style.display = 'none';
}

async function connectBLE() {
if (!navigator.bluetooth) {
alert("이 브라우저는 Web Bluetooth API를 지원하지 않습니다.");
return;
}
try {
const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
document.getElementById('ble-status').innerText = 📡 BLE 연동: ${device.name || 'Wristband'};
} catch (e) {
document.getElementById('ble-status').innerText = "📡 BLE 연동 취소됨";
}
}

window.addEventListener('keydown', (e) => {
if (e.target.tagName === 'INPUT') return; // 입력창 타이핑 중에는 D-Pad 단축키 차단
if (e.key === 'ArrowUp') moveCursor('UP');
if (e.key === 'ArrowDown') moveCursor('DOWN');
if (e.key === 'ArrowLeft') moveCursor('LEFT');
if (e.key === 'ArrowRight') moveCursor('RIGHT');
if (e.key === 'Enter') pressSelect();
if (e.key === 'Escape') closePlayer();
});

renderKeyboard();
renderResults();
</script>
</body>
</html>
